<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26333D">
  <title>Bitácora de Camiones</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bitácora">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>%F0%9F%9A%9A</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app"></div>
  <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>

  <!-- Muestra en pantalla cualquier error de carga en vez de quedar en blanco -->
  <script>
    (function () {
      function show(msg) {
        var el = document.getElementById("app");
        if (!el) return;
        el.innerHTML =
          '<div style="max-width:520px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#1B1A17">' +
          '<h2 style="margin:0 0 10px">No se pudo cargar la app</h2>' +
          '<p style="color:#7A776E;margin:0 0 12px">Detalle técnico (para diagnóstico):</p>' +
          '<pre style="white-space:pre-wrap;background:#F3F2EE;border:1px solid #D2CFC5;border-radius:10px;padding:12px;font-size:.82rem;overflow:auto">' +
          String(msg).replace(/</g, "&lt;") + "</pre></div>";
      }
      window.addEventListener("error", function (e) {
        if (e && e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
          show("No se pudo cargar el archivo: " + (e.target.src || e.target.href) +
               "\n\nProbablemente ese archivo falta en el repositorio o la ruta no coincide.");
        } else if (e && e.message) {
          show(e.message + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        show((r && (r.message || r)) || "Error desconocido al iniciar.");
      });
    })();
  </script>
  <script>
    // Versión visible de la app. Debe coincidir con APP_VERSION en sw.js.
    window.BF_VERSION = "1.0.9";
  </script>
  <script type="module" src="main.js"></script>
  <script>
    // Registra el service worker y avisa cuando hay una versión nueva.
    (function () {
      if (!("serviceWorker" in navigator)) return;

      function showUpdate(reg) {
        if (document.getElementById("bf-upd")) return;
        var b = document.createElement("div");
        b.id = "bf-upd";
        b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#26333D;color:#EAF0F3;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:system-ui,-apple-system,sans-serif";
        b.innerHTML = '<span style="flex:1;font-size:.9rem;line-height:1.25">Hay una versión nueva disponible.</span>';
        var btn = document.createElement("button");
        btn.textContent = "Actualizar";
        btn.style.cssText = "background:#E3700B;color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:.9rem";
        btn.onclick = function () {
          btn.disabled = true; btn.textContent = "Actualizando...";
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          else window.location.reload();
        };
        b.appendChild(btn);
        document.body.appendChild(b);
      }

      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          function watch(w) {
            if (!w) return;
            w.addEventListener("statechange", function () {
              // "installed" con un SW ya controlando = es una actualización.
              if (w.state === "installed" && navigator.serviceWorker.controller) showUpdate(reg);
            });
          }
          if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
          watch(reg.installing);
          reg.addEventListener("updatefound", function () { watch(reg.installing); });
          // Busca actualizaciones cada vez que se abre la app.
          reg.update().catch(function () {});
        }).catch(function () {});

        var reloaded = false;
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded || !hadController) return; // primera instalación: no recargar
          reloaded = true; window.location.reload();
        });
      });
    })();
  </script>
</body>
</html>
